name: 编译 C++ 程序

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 把代码复制到云端
      uses: actions/checkout@v4

    - name: 2. 编译 C++ 代码
      run: g++ hello.cpp -o hello.exe

    - name: 3. 上传生成的 exe 文件
      uses: actions/upload-artifact@v4
      with:
        name: my-cpp-program
        path: hello.exe